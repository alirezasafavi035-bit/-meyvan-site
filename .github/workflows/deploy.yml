name: Deploy MEYVAN to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs every 30 minutes to fetch latest gold prices and rebuild static site
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Update Gold Prices (Graceful fallback)
        env:
          PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
        run: node scripts/update-prices.mjs

      - name: Validate Jewelry Catalog
        run: node scripts/validate-catalog.mjs

      - name: Build Static App
        env:
          VITE_PRICE_API: ${{ vars.VITE_PRICE_API }}
          VITE_PAYMENT_API: ${{ vars.VITE_PAYMENT_API }}
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
